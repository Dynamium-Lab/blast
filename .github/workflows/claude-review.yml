name: Claude review

# Reviews every open, non-draft pull request with Claude Code and posts the
# findings as comments: inline on the lines concerned, plus one summary.
# Runs again on each push to the pull request. Pull requests from forks are
# skipped: GitHub gives them no secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request ${{ github.event.pull_request.html_url }} (base ${{ github.event.pull_request.base.ref }}, head ${{ github.event.pull_request.head.sha }}).
            The repository is checked out at the head of the pull request. Read AGENTS.md or CLAUDE.md at its root for the project's conventions.

            1. Run `/code-review medium ${{ github.event.pull_request.html_url }}` and keep its findings.
            2. For each finding, post an inline comment on the line concerned with mcp__github_inline_comment__create_inline_comment: the problem, then the concrete failure scenario.
            3. Post one summary comment with `gh pr comment`: the number of findings, each in one line ranked most severe first, or "No findings." when there are none. Start it with "Automated review by Claude (head ${{ github.event.pull_request.head.sha }})".

            Write in English, like the rest of the repository. Do not use em dashes or en dashes.
            Do not approve, request changes, push, or edit any file.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Skill,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
