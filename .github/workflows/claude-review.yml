name: Claude review

# Reviews every open, non-draft pull request with Claude Code and posts the
# findings as comments: inline on the lines concerned, plus one summary.
# Runs again on each push to the pull request. Pull requests from forks are
# skipped: GitHub gives them no secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Runs for the same pull request queue instead of cancelling each other, so a
# run is never stopped halfway through posting its comments.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Dependabot pull requests get no Actions secrets, like forks.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request ${{ github.event.pull_request.html_url }} (base ${{ github.event.pull_request.base.ref }}, head ${{ github.event.pull_request.head.sha }}).
            The repository is checked out at the head of the pull request. Read AGENTS.md or CLAUDE.md at its root for the project's conventions.

            1. Run `/code-review medium ${{ github.event.pull_request.html_url }}` and keep its findings.
            2. List the inline comments already on the pull request with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`. Skip any finding that a comment by github-actions[bot] already reports on the same file and line.
            3. For each remaining finding, post an inline comment on the line concerned with mcp__github_inline_comment__create_inline_comment: the problem, then the concrete failure scenario.
            4. Post the summary with `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file <file>`, so the pull request keeps a single summary that each run replaces. Start it with "Automated review by Claude (head ${{ github.event.pull_request.head.sha }})", then give the number of findings for this head, each in one line ranked most severe first, or "No findings." when there are none.

            Write in English, like the rest of the repository. Do not use em dashes or en dashes.
            Do not approve, request changes, push, or edit any file.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Skill,Agent,Read,Write,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git status:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),mcp__github_inline_comment__create_inline_comment"
